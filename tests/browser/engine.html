<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Browser engine test</title>
  </head>
  <body>
    <script type="module">
      import { AVA, registerEngine } from '@antv/ava/browser';
      import { DuckDBWasmEngine } from 'ava-engine-duckdb-wasm';
      import { MockLanguageModelV4 } from 'ai/test';
      import { createVisualizationQueue } from '/src/runtime/visualizations.ts';
      import { readCSV } from '/src/runtime/csv.ts';
      import {
        putNode,
        applyEvent,
        completeRun,
        eventNodeId,
      } from '/shared/evidence.mjs';
      import { bundles } from '/src/runtime/duckdb-bundles.ts';
      registerEngine('duckdb-wasm', DuckDBWasmEngine);
      window.createEngine = (options = {}) =>
        new DuckDBWasmEngine({ model: 'test' }, { bundles, ...options });
      Object.assign(window, {
        AVA,
        MockLanguageModelV4,
        createVisualizationQueue,
        readCSV,
        putNode,
        applyEvent,
        completeRun,
        eventNodeId,
      });
      window.bundles = bundles;
    </script>
  </body>
</html>
